services:
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.node
    command: ["pnpm", "--filter", "@news-podcast/api", "dev"]
    ports:
      - "3000:3000"
    volumes:
      - app-data:/app/data
    depends_on:
      voicevox:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.node
    command: ["pnpm", "--filter", "@news-podcast/worker", "test"]
    volumes:
      - app-data:/app/data
      - audio-data:/app/audio
    depends_on:
      voicevox:
        condition: service_healthy

  voicevox:
    image: voicevox/voicevox_engine:cpu-latest
    ports:
      - "127.0.0.1:50021:50021"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:50021/version"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  app-data:
  audio-data:
