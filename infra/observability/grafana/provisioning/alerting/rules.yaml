apiVersion: 1

groups:
  - orgId: 1
    name: coordinated-backup
    folder: News Podcast
    interval: 1m
    rules:
      - uid: np-backup-rpo
        title: Coordinated backup exceeded its RPO
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model:
              editorMode: code
              expr: '(news_podcast_backup_generation_age_seconds < bool 0) + (news_podcast_backup_generation_age_seconds > bool 90000)'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { params: [], type: last }
                  type: query
              expression: A
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Error
        for: 5m
        annotations:
          summary: Coordinated backup has no generation inside the 24-hour RPO
          description: Inspect state-backup logs and the immutable destination, then follow the coordinated recovery runbook. Do not accept an uncommitted generation.
        labels: { severity: critical, team: platform }

      - uid: np-backup-failure
        title: Coordinated backup or restore drill failed
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              editorMode: code
              expr: 'sum(increase(news_podcast_backup_failures_total[5m])) + sum(increase(news_podcast_restore_drill_failures_total[5m]))'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { params: [], type: last }
                  type: query
              expression: A
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Error
        for: 1m
        annotations:
          summary: Coordinated backup or restore drill failed
          description: Inspect the structured state-backup failure event; a partial generation has no commit marker and must not be restored.
        labels: { severity: critical, team: platform }

      - uid: np-backup-drill-stale
        title: Restore drill is overdue
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model:
              editorMode: code
              expr: 'time() - news_podcast_restore_drill_last_success_timestamp_seconds > 691200'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { params: [], type: last }
                  type: query
              expression: A
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Error
        for: 5m
        annotations:
          summary: No successful restore drill in eight days
          description: Restore the latest committed generation and verify all article archive and Episode audio references before clearing this alert.
        labels: { severity: critical, team: platform }

      - uid: np-backup-consistency
        title: Backup consistency barrier rejected or exceeded its budget
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              editorMode: code
              expr: 'sum(increase(news_podcast_backup_rejections_total[5m])) + (max(news_podcast_backup_barrier_duration_seconds) > bool 25)'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { params: [], type: last }
                  type: query
              expression: A
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Error
        for: 1m
        annotations:
          summary: The coordinated backup consistency boundary was rejected or slow
          description: Inspect the reason label and state-backup log. Do not restore or manually commit a rejected generation; verify writer contention, Production/Library completion convergence, and object inventory stability.
        labels: { severity: critical, team: platform }

  - orgId: 1
    name: service-reliability
    folder: News Podcast
    interval: 1m
    rules:
      - uid: np-service-errors
        title: Service error rate is above 5%
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              editorMode: code
              expr: 'sum by (service_name) (rate(traces_spanmetrics_calls_total{status_code="STATUS_CODE_ERROR"}[5m])) / clamp_min(sum by (service_name) (rate(traces_spanmetrics_calls_total[5m])), 0.001)'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [0.05], type: gt }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { params: [], type: last }
                  type: query
              expression: A
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Error
        for: 5m
        annotations:
          summary: '{{ $labels.service_name }} error rate is above 5%'
          description: Open Service Overview, then follow an exemplar or Tempo service graph to the failing dependency and correlated logs.
        labels: { severity: critical, team: platform }

      - uid: np-service-latency
        title: Service p95 latency exceeds 2 seconds
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              editorMode: code
              expr: 'histogram_quantile(0.95, sum by (le, service_name) (rate(traces_spanmetrics_duration_milliseconds_bucket[5m])))'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [2000], type: gt }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { params: [], type: last }
                  type: query
              expression: A
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Error
        for: 10m
        annotations:
          summary: '{{ $labels.service_name }} p95 latency exceeds 2 seconds'
          description: Use the service graph edge latency and representative traces to identify the slow dependency or database operation.
        labels: { severity: warning, team: platform }

      - uid: np-api-5xx
        title: API returned 5xx responses
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              editorMode: code
              expr: 'sum by (service_name, http_response_status_code) (increase(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[5m]))'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { params: [], type: last }
                  type: query
              expression: A
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Error
        for: 1m
        annotations:
          summary: '{{ $labels.service_name }} returned a 5xx response'
          description: Inspect the linked trace and logs with the same trace_id before retrying the operation.
        labels: { severity: critical, team: platform }

  - orgId: 1
    name: episode-production
    folder: News Podcast
    interval: 1m
    rules:
      - uid: np-generation-failure
        title: Episode generation failed
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              editorMode: code
              expr: 'sum by (span_name) (rate(traces_spanmetrics_calls_total{service_name="episode-production",status_code="STATUS_CODE_ERROR"}[5m]))'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { params: [], type: last }
                  type: query
              expression: A
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Error
        for: 1m
        annotations:
          summary: 'Episode Production error span: {{ $labels.span_name }}'
          description: Open Episode Production, find the error log, and follow trace_id across worker, provider, storage, and database spans.
        labels: { severity: critical, team: platform }

      - uid: np-generation-queue-age
        title: Episode queue age is near the job deadline
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              editorMode: code
              expr: 'max(episode_queue_oldest_age)'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [1440000], type: gt }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { params: [], type: last }
                  type: query
              expression: A
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Error
        for: 2m
        annotations:
          summary: Episode queue age exceeds 24 minutes
          description: Check worker health, active NATS/queue edges, provider latency, and stale lease traces.
        labels: { severity: critical, team: platform }

      - uid: np-script-quality-rejected
        title: Generated script was rejected by the quality gate
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              editorMode: code
              expr: 'sum by (gen_ai_request_model, episode_script_prompt_version, episode_script_quality_prompt_version, quality_reason) (increase(episode_script_quality_total{quality_outcome="reject"}[5m]))'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { params: [], type: last }
                  type: query
              expression: A
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: 'Script quality rejected: {{ $labels.quality_reason }}'
          description: Check only the model, prompt versions, reason code, and failed job state. Do not copy the source, draft, URL, or attack payload into logs. Keep publication blocked and run the version-pinned security eval before changing the gate.
        labels: { severity: warning, team: platform }

  - orgId: 1
    name: watchdog
    folder: News Podcast
    interval: 1m
    rules:
      - uid: np-watchdog-target-down
        title: Watchdog target is unavailable
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model:
              editorMode: code
              expr: 'min by (target) (news_podcast_watchdog_target_up)'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [1], type: lt }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { params: [], type: last }
                  type: query
              expression: A
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Error
        for: 1m
        annotations:
          summary: 'Watchdog target down: {{ $labels.target }}'
          description: Inspect the target container, readiness checks, and first terminal runtime error before retrying traffic.
        labels: { severity: critical, team: platform }

      - uid: np-watchdog-missing
        title: Watchdog is missing or its checks are failing
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model:
              editorMode: code
              expr: 'news_podcast_watchdog_last_check_success == 0 or absent(news_podcast_watchdog_last_check_success)'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { params: [], type: last }
                  type: query
              expression: A
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Error
        for: 2m
        annotations:
          summary: Watchdog monitoring has disappeared
          description: Restore Watchdog before treating silence from service alerts as healthy.
        labels: { severity: critical, team: platform }

  - orgId: 1
    name: telemetry-pipeline
    folder: News Podcast
    interval: 1m
    rules:
      - uid: np-otel-export-failure
        title: OTel Collector export is failing
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              editorMode: code
              expr: 'sum by (exporter) (increase({__name__=~"otelcol_exporter_send_failed_(spans|metric_points|log_records)_total"}[5m]))'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { params: [], type: last }
                  type: query
              expression: A
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Error
        for: 2m
        annotations:
          summary: 'Collector export failure: {{ $labels.exporter }}'
          description: Telemetry may be incomplete. Check Collector queues and Prometheus/Loki/Tempo readiness; business processing should remain available.
        labels: { severity: critical, team: platform }

      - uid: np-uninstrumented-entry
        title: Uninstrumented entry point detected
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 1200, to: 0 }
            model:
              editorMode: code
              expr: 'sum by (service_name, operation_stage) (increase(trace_entry_synthesized_total[15m]))'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { params: [], type: last }
                  type: query
              expression: A
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Error
        for: 1m
        annotations:
          summary: '{{ $labels.service_name }} synthesized a root span'
          description: The entry point lost its parent/link context. Fix instrumentation before relying on the affected service graph edge.
        labels: { severity: warning, team: platform }
