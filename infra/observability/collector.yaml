receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:14318
  hostmetrics:
    collection_interval: 30s
    root_path: /hostfs
    scrapers:
      filesystem:
        exclude_fs_types:
          fs_types: [autofs, binfmt_misc, bpf, cgroup2, configfs, debugfs, devpts, devtmpfs, fusectl, hugetlbfs, mqueue, overlay, proc, pstore, securityfs, sysfs, tracefs]
          match_type: strict
  prometheus/internal:
    config:
      scrape_configs:
        - job_name: otel-gateway
          scrape_interval: 30s
          static_configs:
            - targets: [127.0.0.1:8888]

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  attributes/privacy:
    actions:
      - { key: user.id, action: delete }
      - { key: enduser.id, action: delete }
      - { key: http.request.header.authorization, action: delete }
      - { key: url.full, action: delete }
      - { key: http.url, action: delete }
  batch:
    send_batch_size: 512
    send_batch_max_size: 1024
    timeout: 5s

exporters:
  otlphttp/signoz:
    endpoint: http://127.0.0.1:4318
    sending_queue:
      enabled: true
      queue_size: 2048
    retry_on_failure:
      enabled: true
      max_elapsed_time: 30s

service:
  telemetry:
    logs:
      level: info
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/privacy, batch]
      exporters: [otlphttp/signoz]
    metrics:
      receivers: [otlp, hostmetrics, prometheus/internal]
      processors: [memory_limiter, attributes/privacy, batch]
      exporters: [otlphttp/signoz]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, attributes/privacy, batch]
      exporters: [otlphttp/signoz]
