extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  file_storage/queue:
    directory: /var/lib/otelcol/storage
    timeout: 1s

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
connectors:
  spanmetrics:
    namespace: traces.spanmetrics
    histogram:
      explicit:
        buckets: [5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2.5s, 5s, 10s, 30s]
    exemplars:
      enabled: true
    dimensions:
      - name: deployment.environment.name
      - name: service.version
      - name: messaging.system
      - name: messaging.destination.name
      - name: rpc.method
      - name: db.system.name
      - name: db.operation.name
      - name: server.address
      - name: service.peer.name
  servicegraph:
    latency_histogram_buckets: [5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2.5s, 5s, 10s, 30s]
    dimensions:
      - deployment.environment.name
    virtual_node_peer_attributes:
      - service.peer.name
      - peer.service
      - server.address
      - db.namespace
      - db.name
      - db.system.name
      - messaging.destination.name
      - messaging.system
    store:
      ttl: 30s
      max_items: 10000
    metrics_flush_interval: 15s

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  attributes/privacy:
    actions:
      - { key: user.id, action: delete }
      - { key: enduser.id, action: delete }
      - { key: http.request.header.authorization, action: delete }
      - { key: http.request.header.cookie, action: delete }
      - { key: url.full, action: delete }
      - { key: http.url, action: delete }
      - { key: db.statement, action: delete }
      - { key: messaging.message.body, action: delete }
  transform/resource_allowlist:
    error_mode: propagate
    trace_statements:
      - context: resource
        statements:
          - set(resource.attributes["telemetry.backend"], "grafana-lgtm")
          - keep_keys(resource.attributes, ["service.name", "service.version", "deployment.environment.name", "telemetry.schema.version", "telemetry.backend"])
    metric_statements:
      - context: resource
        statements:
          - set(resource.attributes["telemetry.backend"], "grafana-lgtm")
          - keep_keys(resource.attributes, ["service.name", "service.version", "deployment.environment.name", "telemetry.schema.version", "telemetry.backend"])
      - context: datapoint
        statements:
          - set(datapoint.attributes["service.name"], resource.attributes["service.name"]) where resource.attributes["service.name"] != nil
          - set(datapoint.attributes["service.version"], resource.attributes["service.version"]) where resource.attributes["service.version"] != nil
          - set(datapoint.attributes["deployment.environment.name"], resource.attributes["deployment.environment.name"]) where resource.attributes["deployment.environment.name"] != nil
          - set(datapoint.attributes["telemetry.schema.version"], resource.attributes["telemetry.schema.version"]) where resource.attributes["telemetry.schema.version"] != nil
          - set(datapoint.attributes["telemetry.backend"], resource.attributes["telemetry.backend"])
    log_statements:
      - context: resource
        statements:
          - set(resource.attributes["telemetry.backend"], "grafana-lgtm")
          - keep_keys(resource.attributes, ["service.name", "service.version", "deployment.environment.name", "telemetry.schema.version", "telemetry.backend"])
  batch:
    send_batch_size: 512
    send_batch_max_size: 1024
    timeout: 5s

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
    sending_queue:
      enabled: true
      queue_size: 2048
      storage: file_storage/queue
    retry_on_failure:
      enabled: true
      max_elapsed_time: 0s
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    sending_queue:
      enabled: true
      queue_size: 2048
      storage: file_storage/queue
    retry_on_failure:
      enabled: true
      max_elapsed_time: 0s
  prometheusremotewrite:
    endpoint: http://prometheus:9090/api/v1/write
    send_metadata: true
    remote_write_queue:
      enabled: true
      queue_size: 20000
    wal:
      directory: /var/lib/otelcol/storage/prometheusremotewrite
      buffer_size: 300
      truncate_frequency: 1m
    retry_on_failure:
      enabled: true
      max_elapsed_time: 0s

service:
  extensions: [health_check, file_storage/queue]
  telemetry:
    logs:
      level: info
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/privacy, transform/resource_allowlist, batch]
      exporters: [otlp/tempo, spanmetrics, servicegraph]
    metrics:
      receivers: [otlp, spanmetrics, servicegraph]
      processors: [memory_limiter, attributes/privacy, transform/resource_allowlist, batch]
      exporters: [prometheusremotewrite]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, attributes/privacy, transform/resource_allowlist, batch]
      exporters: [otlphttp/loki]
