global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    cluster: news-podcast-local

# The Collector's persistent queue may replay delayed samples after a backend
# outage. Keep that recovery data instead of silently dropping it as out-of-order.
storage:
  tsdb:
    out_of_order_time_window: 2h

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8888]
  - job_name: loki
    static_configs:
      - targets: [loki:3100]
  - job_name: tempo
    static_configs:
      - targets: [tempo:3200]
  - job_name: grafana
    static_configs:
      - targets: [grafana:3000]
