services:
  otlp-ingress:
    image: nginx:1.29.1-alpine
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    environment:
      NGINX_ENVSUBST_FILTER: "^(OTLP_DOMAIN|TELEMETRY_PROXY_TOKEN)$"
      OTLP_DOMAIN: ${OTLP_DOMAIN:?set OTLP_DOMAIN}
      TELEMETRY_PROXY_TOKEN: ${TELEMETRY_PROXY_TOKEN:?set TELEMETRY_PROXY_TOKEN}
    tmpfs:
      - /var/cache/nginx
      - /var/run
    ports:
      - "443:443"
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      otel-collector:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-check-certificate",
          "--quiet",
          "--spider",
          "https://127.0.0.1/health/live",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [observability]

  watchdog:
    build:
      context: ../..
      dockerfile: infra/Dockerfile.node
      network: host
    command: ["pnpm", "--filter", "@news-podcast/watchdog", "start"]
    restart: unless-stopped
    stop_grace_period: 15s
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      WATCHDOG_GATEWAY_URL: http://host.docker.internal:4101/health/ready
      WATCHDOG_IDENTITY_ACCESS_URL: http://host.docker.internal:4102/health/ready
      WATCHDOG_CONTENT_KNOWLEDGE_URL: http://host.docker.internal:4103/health/ready
      WATCHDOG_EPISODE_PRODUCTION_URL: http://host.docker.internal:4104/health/ready
      WATCHDOG_EPISODE_LIBRARY_URL: http://host.docker.internal:4105/health/ready
      WATCHDOG_WEB_URL: http://host.docker.internal:4173/
      WATCHDOG_NATS_URL: http://host.docker.internal:8222/healthz?js-enabled-only=true
      WATCHDOG_SEAWEEDFS_URL: http://host.docker.internal:9333/cluster/status
      WATCHDOG_VOICEVOX_URL: http://host.docker.internal:50021/version
      WATCHDOG_GRAFANA_URL: http://grafana:3000/api/health
      WATCHDOG_COLLECTOR_METRICS_URL: http://otel-collector:8888/metrics
      WATCHDOG_SMTP_HOST: ${WATCHDOG_SMTP_HOST:-}
      WATCHDOG_SMTP_PORT: ${WATCHDOG_SMTP_PORT:-587}
      WATCHDOG_SMTP_SECURE: ${WATCHDOG_SMTP_SECURE:-false}
      WATCHDOG_SMTP_USERNAME: ${WATCHDOG_SMTP_USERNAME:-}
      WATCHDOG_SMTP_PASSWORD: ${WATCHDOG_SMTP_PASSWORD:-}
      WATCHDOG_SMTP_FROM: ${WATCHDOG_SMTP_FROM:-}
      WATCHDOG_SMTP_TO: ${WATCHDOG_SMTP_TO:-}
      WATCHDOG_STATE_PATH: /var/lib/news-podcast-watchdog/state.json
      WATCHDOG_PORT: "4199"
    volumes:
      - watchdog-data:/var/lib/news-podcast-watchdog
    networks: [observability]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4199/health/live').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 10s
      timeout: 3s
      retries: 6

volumes:
  watchdog-data:
