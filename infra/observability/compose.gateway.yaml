services:
  otel-gateway:
    image: otel/opentelemetry-collector-contrib:0.135.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    network_mode: host
    restart: unless-stopped
    read_only: true
    volumes:
      - ./collector.yaml:/etc/otelcol-contrib/config.yaml:ro
      - /:/hostfs:ro

  otlp-ingress:
    image: nginx:1.29.1-alpine
    network_mode: host
    restart: unless-stopped
    read_only: true
    environment:
      NGINX_ENVSUBST_FILTER: "^(OTLP_DOMAIN|TELEMETRY_PROXY_TOKEN)$"
      OTLP_DOMAIN: ${OTLP_DOMAIN:?set OTLP_DOMAIN}
      TELEMETRY_PROXY_TOKEN: ${TELEMETRY_PROXY_TOKEN:?set TELEMETRY_PROXY_TOKEN}
    tmpfs:
      - /var/cache/nginx
      - /var/run
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - otel-gateway

  watchdog:
    build:
      context: ../..
      dockerfile: infra/Dockerfile.node
      network: host
    command: ["pnpm", "--filter", "@news-podcast/watchdog", "start"]
    network_mode: host
    restart: unless-stopped
    environment:
      WATCHDOG_API_URL: http://127.0.0.1:4000/health
      WATCHDOG_WORKER_URL: http://127.0.0.1:3001/health
      WATCHDOG_VOICEVOX_URL: http://127.0.0.1:50021/version
      WATCHDOG_SIGNOZ_URL: http://127.0.0.1:8100/api/v1/health
      WATCHDOG_COLLECTOR_METRICS_URL: http://127.0.0.1:8888/metrics
      WATCHDOG_SMTP_HOST: ${WATCHDOG_SMTP_HOST:?set WATCHDOG_SMTP_HOST}
      WATCHDOG_SMTP_PORT: ${WATCHDOG_SMTP_PORT:-587}
      WATCHDOG_SMTP_SECURE: ${WATCHDOG_SMTP_SECURE:-false}
      WATCHDOG_SMTP_USERNAME: ${WATCHDOG_SMTP_USERNAME:?set WATCHDOG_SMTP_USERNAME}
      WATCHDOG_SMTP_PASSWORD: ${WATCHDOG_SMTP_PASSWORD:?set WATCHDOG_SMTP_PASSWORD}
      WATCHDOG_SMTP_FROM: ${WATCHDOG_SMTP_FROM:?set WATCHDOG_SMTP_FROM}
      WATCHDOG_SMTP_TO: ${WATCHDOG_SMTP_TO:?set WATCHDOG_SMTP_TO}
      WATCHDOG_STATE_PATH: /var/lib/news-podcast-watchdog/state.json
    volumes:
      - watchdog-data:/var/lib/news-podcast-watchdog
    depends_on:
      - otel-gateway

volumes:
  watchdog-data:
