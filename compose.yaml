services:
  gateway:
    restart: unless-stopped
    stop_grace_period: 30s
    build:
      context: .
      dockerfile: infra/Dockerfile.node
      network: host
    command: ["pnpm", "--filter", "@news-podcast/gateway", "start"]
    environment:
      APP_ENV: "${APP_ENV:-development}"
      AUTH_PROXY_MAX_RESPONSE_BYTES: "${AUTH_PROXY_MAX_RESPONSE_BYTES:-1048576}"
      AUTH_PROXY_TIMEOUT_MS: "${AUTH_PROXY_TIMEOUT_MS:-5000}"
      BROWSER_OTLP_HTTP_ORIGIN: "${BROWSER_OTLP_HTTP_ORIGIN:-http://otel-collector:4319}"
      CONTENT_ARCHIVE_TIMEOUT_MS: "${CONTENT_ARCHIVE_TIMEOUT_MS:-30000}"
      DEV_AUTH_ENABLED: "${DEV_AUTH_ENABLED:-true}"
      GATEWAY_HEALTH_PORT: "4101"
      GATEWAY_HOST: "${GATEWAY_HOST:-}"
      GATEWAY_PORT: "4001"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      HEALTH_PORT: "4101"
      IDENTITY_HTTP_ORIGIN: http://identity-access:4002
      NATS_REQUEST_TIMEOUT_MS: "${NATS_REQUEST_TIMEOUT_MS:-2000}"
      NATS_SERVERS: nats://nats:4222
      OTEL_AUTO_INSTRUMENTATION: "${OTEL_AUTO_INSTRUMENTATION:-}"
      OTEL_ENABLED: "${OTEL_ENABLED:-false}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
      OTEL_EXPORTER_OTLP_HEADERS: "${OTEL_EXPORTER_OTLP_HEADERS:-}"
      OTEL_PROPAGATION_ALLOWLIST: "${OTEL_PROPAGATION_ALLOWLIST:-}"
      OTEL_SERVICE_VERSION: "${OTEL_SERVICE_VERSION:-development}"
      OTEL_TRACE_SAMPLE_RATE: "${OTEL_TRACE_SAMPLE_RATE:-1}"
      TELEMETRY_PROXY_MAX_REQUEST_BYTES: "${TELEMETRY_PROXY_MAX_REQUEST_BYTES:-1048576}"
      TELEMETRY_PROXY_MAX_RESPONSE_BYTES: "${TELEMETRY_PROXY_MAX_RESPONSE_BYTES:-1048576}"
      TELEMETRY_PROXY_TIMEOUT_MS: "${TELEMETRY_PROXY_TIMEOUT_MS:-5000}"
      TELEMETRY_PROXY_TOKEN: "${TELEMETRY_PROXY_TOKEN:-}"
    ports:
      - "127.0.0.1:4001:4001"
      - "127.0.0.1:4101:4101"
    depends_on:
      identity-access:
        condition: service_healthy
      content-knowledge:
        condition: service_healthy
      episode-production:
        condition: service_healthy
      episode-library:
        condition: service_healthy
    healthcheck: &context-health
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:' + process.env.HEALTH_PORT + '/health/ready').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  identity-access:
    restart: unless-stopped
    stop_grace_period: 30s
    build:
      context: .
      dockerfile: infra/Dockerfile.node
      network: host
    command: ["pnpm", "--filter", "@news-podcast/identity-access", "start"]
    environment:
      APP_ENV: "${APP_ENV:-development}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:-}"
      BETTER_AUTH_URL: "${BETTER_AUTH_URL:-http://localhost:4173}"
      DEV_AUTH_ENABLED: "${DEV_AUTH_ENABLED:-true}"
      DEV_AUTH_PASSWORD: "${DEV_AUTH_PASSWORD:-}"
      DEV_AUTH_USER_ID: "${DEV_AUTH_USER_ID:-00000000-0000-4000-8000-000000000100}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      HEALTH_PORT: "4102"
      IDENTITY_DATABASE_PATH: /app/data/identity.sqlite
      IDENTITY_HEALTH_PORT: "4102"
      IDENTITY_HTTP_HOST: "${IDENTITY_HTTP_HOST:-}"
      IDENTITY_HTTP_PORT: "4002"
      IDENTITY_QUEUE_GROUP: "${IDENTITY_QUEUE_GROUP:-identity-access}"
      NATS_SERVERS: nats://nats:4222
      OTEL_AUTO_INSTRUMENTATION: "${OTEL_AUTO_INSTRUMENTATION:-}"
      OTEL_ENABLED: "${OTEL_ENABLED:-false}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
      OTEL_EXPORTER_OTLP_HEADERS: "${OTEL_EXPORTER_OTLP_HEADERS:-}"
      OTEL_PROPAGATION_ALLOWLIST: "${OTEL_PROPAGATION_ALLOWLIST:-}"
      OTEL_SERVICE_VERSION: "${OTEL_SERVICE_VERSION:-development}"
      OTEL_TRACE_SAMPLE_RATE: "${OTEL_TRACE_SAMPLE_RATE:-1}"
    ports:
      - "127.0.0.1:4102:4102"
    volumes:
      - identity-data:/app/data
    depends_on:
      nats:
        condition: service_healthy
    healthcheck: *context-health

  content-knowledge:
    restart: unless-stopped
    stop_grace_period: 30s
    build:
      context: .
      dockerfile: infra/Dockerfile.node
      network: host
    command: ["pnpm", "--filter", "@news-podcast/content-knowledge", "start"]
    environment:
      APP_ENV: "${APP_ENV:-development}"
      CONTENT_ARCHIVE_CLEANUP_INTERVAL_MS: "${CONTENT_ARCHIVE_CLEANUP_INTERVAL_MS:-21600000}"
      CONTENT_ARCHIVE_MAX_ASSET_BYTES: "${CONTENT_ARCHIVE_MAX_ASSET_BYTES:-20971520}"
      CONTENT_ARCHIVE_MAX_ASSET_COUNT: "${CONTENT_ARCHIVE_MAX_ASSET_COUNT:-512}"
      CONTENT_ARCHIVE_MAX_ASSET_TOTAL_BYTES: "${CONTENT_ARCHIVE_MAX_ASSET_TOTAL_BYTES:-104857600}"
      CONTENT_ARCHIVE_MAX_HTML_BYTES: "${CONTENT_ARCHIVE_MAX_HTML_BYTES:-5242880}"
      CONTENT_ARCHIVE_ORPHAN_RETENTION_MS: "${CONTENT_ARCHIVE_ORPHAN_RETENTION_MS:-86400000}"
      CONTENT_ARCHIVE_TIMEOUT_MS: "${CONTENT_ARCHIVE_TIMEOUT_MS:-30000}"
      CONTENT_ENRICH_DAILY_LIMIT: "200"
      CONTENT_ENRICH_INITIAL_BACKOFF_MS: "1000"
      CONTENT_ENRICH_INTERVAL_MS: "60000"
      CONTENT_ENRICH_MAX_BACKOFF_MS: "30000"
      CONTENT_ENRICH_OPENAI_MODEL: "${CONTENT_ENRICH_OPENAI_MODEL:-}"
      CONTENT_ENRICH_OPENAI_TIMEOUT_MS: "${CONTENT_ENRICH_OPENAI_TIMEOUT_MS:-60000}"
      CONTENT_ENRICH_RESET_ENABLED: "${CONTENT_ENRICH_RESET_ENABLED:-false}"
      CONTENT_HEALTH_PORT: "4103"
      CONTENT_KNOWLEDGE_DATABASE_PATH: /app/data/content.sqlite
      CONTENT_RPC_QUEUE_GROUP: "${CONTENT_RPC_QUEUE_GROUP:-content-knowledge}"
      CONTENT_RSS_INITIAL_BACKOFF_MS: "${CONTENT_RSS_INITIAL_BACKOFF_MS:-1000}"
      CONTENT_RSS_INTERVAL_MS: "${CONTENT_RSS_INTERVAL_MS:-300000}"
      CONTENT_RSS_MAX_BACKOFF_MS: "${CONTENT_RSS_MAX_BACKOFF_MS:-30000}"
      CONTENT_RSS_MAX_BYTES: "${CONTENT_RSS_MAX_BYTES:-2097152}"
      CONTENT_RSS_TIMEOUT_MS: "${CONTENT_RSS_TIMEOUT_MS:-10000}"
      CONTENT_SEARCH_INDEX_BATCH_SIZE: "${CONTENT_SEARCH_INDEX_BATCH_SIZE:-10}"
      CONTENT_SEARCH_INDEX_INITIAL_BACKOFF_MS: "${CONTENT_SEARCH_INDEX_INITIAL_BACKOFF_MS:-1000}"
      CONTENT_SEARCH_INDEX_INTERVAL_MS: "${CONTENT_SEARCH_INDEX_INTERVAL_MS:-5000}"
      CONTENT_SEARCH_INDEX_MAX_BACKOFF_MS: "${CONTENT_SEARCH_INDEX_MAX_BACKOFF_MS:-30000}"
      HEALTH_PORT: "4103"
      NATS_SERVERS: nats://nats:4222
      OPENAI_API_KEY: "${CONTENT_OPENAI_API_KEY:-}"
      OPENAI_API_URL: "${OPENAI_API_URL:-https://api.openai.com/v1}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-5.6-luna}"
      OTEL_AUTO_INSTRUMENTATION: "${OTEL_AUTO_INSTRUMENTATION:-}"
      OTEL_ENABLED: "${OTEL_ENABLED:-false}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
      OTEL_EXPORTER_OTLP_HEADERS: "${OTEL_EXPORTER_OTLP_HEADERS:-}"
      OTEL_PROPAGATION_ALLOWLIST: "${OTEL_PROPAGATION_ALLOWLIST:-}"
      OTEL_SERVICE_VERSION: "${OTEL_SERVICE_VERSION:-development}"
      OTEL_TRACE_SAMPLE_RATE: "${OTEL_TRACE_SAMPLE_RATE:-1}"
      PROVIDER_MODE: "${PROVIDER_MODE:-fake}"
      S3_ACCESS_KEY_ID: "${CONTENT_S3_ACCESS_KEY_ID:-news-podcast-content}"
      S3_BUCKET: "${S3_BUCKET:-news-podcast}"
      S3_ENDPOINT: "${S3_ENDPOINT:-http://seaweedfs:8333}"
      S3_REGION: "${S3_REGION:-us-east-1}"
      S3_SECRET_ACCESS_KEY: "${CONTENT_S3_SECRET_ACCESS_KEY:-news-podcast-content-development-secret}"
    ports:
      - "127.0.0.1:4103:4103"
    volumes:
      - content-data:/app/data
    depends_on:
      nats:
        condition: service_healthy
      s3-provision:
        condition: service_completed_successfully
    healthcheck: *context-health

  episode-production:
    restart: unless-stopped
    stop_grace_period: 30s
    build:
      context: .
      dockerfile: infra/Dockerfile.node
      network: host
    command: ["pnpm", "--filter", "@news-podcast/episode-production", "start"]
    environment:
      APP_ENV: "${APP_ENV:-development}"
      CONTENT_REQUEST_TIMEOUT_MS: "${CONTENT_REQUEST_TIMEOUT_MS:-}"
      EPISODE_COMPLETION_BATCH_SIZE: "${EPISODE_COMPLETION_BATCH_SIZE:-50}"
      EPISODE_COMPLETION_INITIAL_BACKOFF_MS: "${EPISODE_COMPLETION_INITIAL_BACKOFF_MS:-1000}"
      EPISODE_COMPLETION_INTERVAL_MS: "${EPISODE_COMPLETION_INTERVAL_MS:-1000}"
      EPISODE_COMPLETION_MAX_BACKOFF_MS: "${EPISODE_COMPLETION_MAX_BACKOFF_MS:-30000}"
      EPISODE_PRODUCTION_DATABASE_PATH: /app/data/production.sqlite
      EPISODE_PRODUCTION_HEALTH_PORT: "4104"
      EPISODE_PRODUCTION_QUEUE_GROUP: "${EPISODE_PRODUCTION_QUEUE_GROUP:-episode-production}"
      EPISODE_SCHEDULER_FAILURE_BACKOFF_MS: "${EPISODE_SCHEDULER_FAILURE_BACKOFF_MS:-5000}"
      EPISODE_SCHEDULER_INTERVAL_MS: "${EPISODE_SCHEDULER_INTERVAL_MS:-60000}"
      EPISODE_SCHEDULER_REQUEST_TIMEOUT_MS: "${EPISODE_SCHEDULER_REQUEST_TIMEOUT_MS:-5000}"
      EPISODE_WORKER_CANCELLATION_POLL_MS: "${EPISODE_WORKER_CANCELLATION_POLL_MS:-250}"
      EPISODE_WORKER_HEARTBEAT_MS: "${EPISODE_WORKER_HEARTBEAT_MS:-60000}"
      EPISODE_WORKER_IDLE_MS: "${EPISODE_WORKER_IDLE_MS:-1000}"
      EPISODE_WORKER_LEASE_MS: "${EPISODE_WORKER_LEASE_MS:-300000}"
      EPISODE_WORKER_RETRY_DELAY_MS: "${EPISODE_WORKER_RETRY_DELAY_MS:-30000}"
      HEALTH_PORT: "4104"
      NATS_SERVERS: nats://nats:4222
      OPENAI_API_KEY: "${PRODUCTION_OPENAI_API_KEY:-}"
      OPENAI_API_URL: "${OPENAI_API_URL:-https://api.openai.com/v1}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-5.6-luna}"
      OPENAI_REQUEST_TIMEOUT_MS: "${OPENAI_REQUEST_TIMEOUT_MS:-120000}"
      OTEL_AUTO_INSTRUMENTATION: "${OTEL_AUTO_INSTRUMENTATION:-}"
      OTEL_ENABLED: "${OTEL_ENABLED:-false}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
      OTEL_EXPORTER_OTLP_HEADERS: "${OTEL_EXPORTER_OTLP_HEADERS:-}"
      OTEL_PROPAGATION_ALLOWLIST: "${OTEL_PROPAGATION_ALLOWLIST:-}"
      OTEL_SERVICE_VERSION: "${OTEL_SERVICE_VERSION:-development}"
      OTEL_TRACE_SAMPLE_RATE: "${OTEL_TRACE_SAMPLE_RATE:-1}"
      PROVIDER_BASE_DELAY_MS: "${PROVIDER_BASE_DELAY_MS:-1000}"
      PROVIDER_MAXIMUM_ATTEMPTS: "${PROVIDER_MAXIMUM_ATTEMPTS:-3}"
      PROVIDER_MAXIMUM_DELAY_MS: "${PROVIDER_MAXIMUM_DELAY_MS:-30000}"
      PROVIDER_MAXIMUM_ELAPSED_MS: "${PROVIDER_MAXIMUM_ELAPSED_MS:-180000}"
      PROVIDER_MODE: "${PROVIDER_MODE:-fake}"
      S3_ACCESS_KEY_ID: "${PRODUCTION_S3_ACCESS_KEY_ID:-news-podcast-production}"
      S3_BUCKET: "${S3_BUCKET:-news-podcast}"
      S3_ENDPOINT: "${S3_ENDPOINT:-http://seaweedfs:8333}"
      S3_REGION: "${S3_REGION:-us-east-1}"
      S3_REQUEST_TIMEOUT_MS: "${S3_REQUEST_TIMEOUT_MS:-60000}"
      S3_SECRET_ACCESS_KEY: "${PRODUCTION_S3_SECRET_ACCESS_KEY:-news-podcast-production-development-secret}"
      VOICEVOX_BASE_URL: "${VOICEVOX_BASE_URL:-http://voicevox:50021}"
      VOICEVOX_CHARACTER_NAME: "${VOICEVOX_CHARACTER_NAME:-ずんだもん}"
      VOICEVOX_MAXIMUM_AUDIO_BYTES: "${VOICEVOX_MAXIMUM_AUDIO_BYTES:-134217728}"
      VOICEVOX_MAXIMUM_TEXT_CHARACTERS: "${VOICEVOX_MAXIMUM_TEXT_CHARACTERS:-200}"
      VOICEVOX_REQUEST_TIMEOUT_MS: "${VOICEVOX_REQUEST_TIMEOUT_MS:-60000}"
      VOICEVOX_STYLE_NAME: "${VOICEVOX_STYLE_NAME:-}"
    ports:
      - "127.0.0.1:4104:4104"
    volumes:
      - production-data:/app/data
    depends_on:
      nats:
        condition: service_healthy
      voicevox:
        condition: service_healthy
      s3-provision:
        condition: service_completed_successfully
    healthcheck: *context-health

  episode-library:
    restart: unless-stopped
    stop_grace_period: 30s
    build:
      context: .
      dockerfile: infra/Dockerfile.node
      network: host
    command: ["pnpm", "--filter", "@news-podcast/episode-library", "start"]
    environment:
      APP_ENV: "${APP_ENV:-development}"
      EPISODE_LIBRARY_COMPLETION_ACK_WAIT_MILLIS: "30000"
      EPISODE_LIBRARY_COMPLETION_DURABLE_NAME: episode-library-completions
      EPISODE_LIBRARY_COMPLETION_INITIAL_NACK_DELAY_MILLIS: "1000"
      EPISODE_LIBRARY_COMPLETION_MAXIMUM_DELIVERIES: "10"
      EPISODE_LIBRARY_COMPLETION_MAXIMUM_NACK_DELAY_MILLIS: "30000"
      EPISODE_LIBRARY_COMPLETION_STREAM: EPISODE_PRODUCTION
      EPISODE_LIBRARY_DATABASE_PATH: /app/data/library.sqlite
      EPISODE_LIBRARY_HEALTH_PORT: "4105"
      EPISODE_LIBRARY_QUEUE_GROUP: "${EPISODE_LIBRARY_QUEUE_GROUP:-episode-library}"
      HEALTH_PORT: "4105"
      NATS_SERVERS: nats://nats:4222
      OTEL_AUTO_INSTRUMENTATION: "${OTEL_AUTO_INSTRUMENTATION:-}"
      OTEL_ENABLED: "${OTEL_ENABLED:-false}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
      OTEL_EXPORTER_OTLP_HEADERS: "${OTEL_EXPORTER_OTLP_HEADERS:-}"
      OTEL_PROPAGATION_ALLOWLIST: "${OTEL_PROPAGATION_ALLOWLIST:-}"
      OTEL_SERVICE_VERSION: "${OTEL_SERVICE_VERSION:-development}"
      OTEL_TRACE_SAMPLE_RATE: "${OTEL_TRACE_SAMPLE_RATE:-1}"
      S3_ACCESS_KEY_ID: "${LIBRARY_S3_ACCESS_KEY_ID:-news-podcast-library}"
      S3_BUCKET: "${S3_BUCKET:-news-podcast}"
      S3_ENDPOINT: "${S3_ENDPOINT:-http://seaweedfs:8333}"
      S3_REGION: "${S3_REGION:-us-east-1}"
      S3_SECRET_ACCESS_KEY: "${LIBRARY_S3_SECRET_ACCESS_KEY:-news-podcast-library-development-secret}"
    ports:
      - "127.0.0.1:4105:4105"
    volumes:
      - library-data:/app/data
    depends_on:
      nats-provision:
        condition: service_completed_successfully
      s3-provision:
        condition: service_completed_successfully
    healthcheck: *context-health

  nats-provision:
    image: natsio/nats-box:0.19.2
    command:
      [
        "sh",
        "-ec",
        "nats --server nats://nats:4222 stream add EPISODE_PRODUCTION --subjects 'production.job-completed.v2' --storage file --retention limits --discard old --max-msgs=-1 --max-bytes=-1 --max-age=30d --dupe-window=2m --replicas=1 --no-allow-rollup --no-deny-delete --no-deny-purge --defaults || nats --server nats://nats:4222 stream info EPISODE_PRODUCTION",
      ]
    depends_on:
      nats:
        condition: service_healthy
    restart: "no"

  web:
    restart: unless-stopped
    stop_grace_period: 15s
    build:
      context: .
      dockerfile: infra/Dockerfile.web
      network: host
    environment:
      GATEWAY_ORIGIN: http://gateway:4001
      NGINX_ENVSUBST_FILTER: "^GATEWAY_ORIGIN$"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /etc/nginx/conf.d
    ports:
      - "127.0.0.1:4173:4173"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:4173/edge-health",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  nats:
    restart: unless-stopped
    stop_grace_period: 30s
    image: nats:2.12.1-alpine
    command:
      [
        "--jetstream",
        "--store_dir=/data",
        "--http_port=8222",
        "--server_name=news-podcast-dev",
      ]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:8222/healthz?js-enabled-only=true",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  seaweedfs:
    restart: unless-stopped
    stop_grace_period: 30s
    image: chrislusf/seaweedfs@sha256:e0b528145ea514040ab00d03ff0833f56acb1f0e07aeab232e20485af9278fd8
    command:
      [
        "mini",
        "-dir=/data",
        "-s3.port=8333",
        "-s3.config=/run/seaweedfs-secrets/s3-identities.json",
      ]
    entrypoint: ["sh", "/start-seaweedfs.sh"]
    tmpfs:
      - /run/seaweedfs-secrets:mode=0700
    secrets:
      - s3-identities
    environment:
      S3_BUCKET: ${S3_BUCKET:-news-podcast}
    ports:
      - "127.0.0.1:8333:8333"
      - "127.0.0.1:9333:9333"
    volumes:
      - object-data:/data
      - ./infra/security/start-seaweedfs.sh:/start-seaweedfs.sh:ro
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:9333/cluster/status",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  s3-provision:
    image: chrislusf/seaweedfs@sha256:e0b528145ea514040ab00d03ff0833f56acb1f0e07aeab232e20485af9278fd8
    entrypoint: ["sh", "/provision-s3.sh"]
    environment:
      S3_BUCKET: ${S3_BUCKET:-news-podcast}
    volumes:
      - ./infra/security/provision-s3.sh:/provision-s3.sh:ro
    depends_on:
      seaweedfs:
        condition: service_healthy
    restart: "no"

  voicevox:
    image: voicevox/voicevox_engine@sha256:eb8c7f46a7d01217d1ff2b6f018261faedeceded3cc756b4fbbf371791ad6c90
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:50021:50021"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:50021/version"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  watchdog:
    build:
      context: .
      dockerfile: infra/Dockerfile.node
      network: host
    command: ["pnpm", "--filter", "@news-podcast/watchdog", "start"]
    restart: unless-stopped
    stop_grace_period: 15s
    environment:
      WATCHDOG_PORT: "4199"
      WATCHDOG_INTERVAL_MS: ${WATCHDOG_INTERVAL_MS:-60000}
      WATCHDOG_STATE_PATH: /var/lib/news-podcast-watchdog/state.json
      WATCHDOG_SMTP_HOST: ${WATCHDOG_SMTP_HOST:-}
      WATCHDOG_SMTP_PORT: ${WATCHDOG_SMTP_PORT:-587}
      WATCHDOG_SMTP_SECURE: ${WATCHDOG_SMTP_SECURE:-false}
      WATCHDOG_SMTP_USERNAME: ${WATCHDOG_SMTP_USERNAME:-}
      WATCHDOG_SMTP_PASSWORD: ${WATCHDOG_SMTP_PASSWORD:-}
      WATCHDOG_SMTP_FROM: ${WATCHDOG_SMTP_FROM:-}
      WATCHDOG_SMTP_TO: ${WATCHDOG_SMTP_TO:-}
    ports:
      - "127.0.0.1:4199:4199"
    volumes:
      - watchdog-data:/var/lib/news-podcast-watchdog
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4199/health/live').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  state-backup:
    profiles: [backup]
    build:
      context: .
      dockerfile: infra/Dockerfile.node
      network: host
    command: ["pnpm", "--filter", "@news-podcast/state-backup", "start"]
    restart: unless-stopped
    stop_grace_period: 5m
    depends_on:
      s3-provision:
        condition: service_completed_successfully
    environment:
      S3_ENDPOINT: http://seaweedfs:8333
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${BACKUP_SOURCE_S3_ACCESS_KEY_ID:-news-podcast-backup-source}
      S3_SECRET_ACCESS_KEY: ${BACKUP_SOURCE_S3_SECRET_ACCESS_KEY:-news-podcast-backup-source-development-secret}
      S3_BUCKET: ${S3_BUCKET:-news-podcast}
      BACKUP_ARCHIVE_ENDPOINT: ${BACKUP_ARCHIVE_ENDPOINT:-}
      BACKUP_ARCHIVE_REGION: ${BACKUP_ARCHIVE_REGION:-us-east-1}
      BACKUP_ARCHIVE_BUCKET: ${BACKUP_ARCHIVE_BUCKET:-}
      BACKUP_ARCHIVE_ACCESS_KEY_ID: ${BACKUP_ARCHIVE_ACCESS_KEY_ID:-}
      BACKUP_ARCHIVE_SECRET_ACCESS_KEY: ${BACKUP_ARCHIVE_SECRET_ACCESS_KEY:-}
      BACKUP_ARCHIVE_FORCE_PATH_STYLE: ${BACKUP_ARCHIVE_FORCE_PATH_STYLE:-false}
      BACKUP_TARGET_ATTESTATION_FILE: /run/secrets/backup-target-attestation
      BACKUP_ENCRYPTION_KEY_FILE: /run/secrets/backup-encryption-key
      BACKUP_STATE_PATH: /var/lib/news-podcast-backup/state.json
      BACKUP_STAGING_ROOT: /var/lib/news-podcast-backup/staging
      BACKUP_PORT: "4198"
      BACKUP_INTERVAL_MS: ${BACKUP_INTERVAL_MS:-86400000}
      BACKUP_DRILL_INTERVAL_MS: ${BACKUP_DRILL_INTERVAL_MS:-604800000}
      BACKUP_BARRIER_TIMEOUT_MS: ${BACKUP_BARRIER_TIMEOUT_MS:-30000}
      BACKUP_RPO_HOURS: ${BACKUP_RPO_HOURS:-24}
      BACKUP_RTO_HOURS: ${BACKUP_RTO_HOURS:-4}
      BACKUP_RETAINED_GENERATIONS: ${BACKUP_RETAINED_GENERATIONS:-30}
      BACKUP_IMMUTABLE_DAYS: ${BACKUP_IMMUTABLE_DAYS:-35}
    ports:
      - "127.0.0.1:4198:4198"
    volumes:
      # The coordinator only opens BEGIN IMMEDIATE/ROLLBACK transactions, but
      # SQLite requires write-capable mounts to hold the cross-service barrier.
      - identity-data:/source/identity
      - content-data:/source/content
      - production-data:/source/production
      - library-data:/source/library
      - backup-data:/var/lib/news-podcast-backup
    secrets:
      - backup-encryption-key
      - backup-target-attestation
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4198/health/ready').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  identity-data:
  content-data:
  production-data:
  library-data:
  nats-data:
  object-data:
  watchdog-data:
  backup-data:

secrets:
  backup-encryption-key:
    file: ${BACKUP_ENCRYPTION_KEY_FILE_HOST:-./.secrets/backup-encryption-key}

  backup-target-attestation:
    file: ${BACKUP_TARGET_ATTESTATION_FILE_HOST:-./.secrets/backup-target-attestation.json}

  s3-identities:
    file: ${S3_IDENTITIES_FILE_HOST:-./infra/security/s3-identities.development.json}
