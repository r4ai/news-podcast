services:
  web:
    build:
      context: .
      dockerfile: infra/Dockerfile.node
      network: host
    command: ["pnpm", "--filter", "web", "dev", "--host", "0.0.0.0"]
    environment:
      VITE_API_PROXY_TARGET: http://api:4000
    ports:
      - "127.0.0.1:4173:4173"
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.node
      network: host
    command: ["pnpm", "--filter", "@news-podcast/api", "dev"]
    env_file:
      - path: .env.example
      - path: .env
        required: false
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - app-data:/app/data
      - audio-data:/app/audio:ro
    depends_on:
      seaweedfs:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/health').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build:
      context: .
      dockerfile: infra/Dockerfile.node
      network: host
    command: ["pnpm", "--filter", "@news-podcast/worker", "start"]
    env_file:
      - path: .env.example
      - path: .env
        required: false
    environment:
      OTEL_TRACE_SAMPLE_RATE: "1"
      WORKER_HEALTH_PORT: "3001"
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - app-data:/app/data
      - audio-data:/app/audio
    depends_on:
      voicevox:
        condition: service_healthy
      seaweedfs:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/health').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  seaweedfs:
    image: chrislusf/seaweedfs:4.21
    command: ["mini", "-dir=/data", "-s3.port=8333"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-news-podcast}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-news-podcast-development-secret}
      S3_BUCKET: ${S3_BUCKET:-news-podcast}
    ports:
      - "127.0.0.1:8333:8333"
      - "127.0.0.1:9333:9333"
    volumes:
      - object-data:/data

  voicevox:
    image: voicevox/voicevox_engine:cpu-latest
    ports:
      - "127.0.0.1:50021:50021"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:50021/version"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  app-data:
  audio-data:
  object-data:
