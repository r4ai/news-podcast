services:
  gateway:
    environment: &context-otel
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_TRACE_SAMPLE_RATE: "1"
    networks: [default, observability]

  identity-access:
    environment: *context-otel
    networks: [default, observability]

  content-knowledge:
    environment: *context-otel
    networks: [default, observability]

  episode-production:
    environment:
      <<: *context-otel
    networks: [default, observability]

  episode-library:
    environment: *context-otel
    networks: [default, observability]

  watchdog:
    environment:
      WATCHDOG_GRAFANA_URL: http://grafana:3000/api/health
      WATCHDOG_COLLECTOR_URL: http://otel-collector:13133/
      WATCHDOG_COLLECTOR_METRICS_URL: http://otel-collector:8888/metrics
    networks: [default, observability]

networks:
  observability:
    external: true
    name: news-podcast-observability
