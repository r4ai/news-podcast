openapi: 3.1.0
info:
  title: RSS News Podcast API
  version: 0.1.0
  contact:
    name: RSS News Podcast maintainers
  description: >-
    Application REST contract. Better Auth routes under /api/auth/** are
    described by Better Auth's generated OpenAPI document and are not duplicated here.
servers:
  - url: http://localhost:3000
    description: Local development
security:
  - SessionCookie: []
tags:
  - name: System
  - name: Feeds
  - name: Subscriptions
  - name: Settings
  - name: Episode jobs
  - name: Episodes
paths:
  /health:
    get:
      operationId: getHealth
      tags: [System]
      description: Returns process liveness without requiring credentials.
      security: []
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    const: ok
  /v1/feeds:
    get:
      operationId: listFeeds
      tags: [Feeds]
      description: Lists the curated RSS feed catalog available for subscription.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: q
          in: query
          schema: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "200":
          description: Feed catalog page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/me/feed-subscriptions:
    get:
      operationId: listMyFeedSubscriptions
      tags: [Subscriptions]
      description: Lists feed subscriptions owned by the current session user.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: enabled
          in: query
          schema: { type: boolean }
        - name: feedId
          in: query
          schema: { $ref: "#/components/schemas/Id" }
      responses:
        "200":
          description: Current user's subscriptions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedSubscriptionPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createMyFeedSubscription
      tags: [Subscriptions]
      description: Subscribes the current session user to one catalog feed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [feedId]
              properties:
                feedId: { $ref: "#/components/schemas/Id" }
      responses:
        "201":
          description: Subscription created.
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedSubscription" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/me/settings:
    get:
      operationId: getMySettings
      tags: [Settings]
      description: Returns the current user's daily episode generation schedule.
      responses:
        "200":
          description: Current user settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    patch:
      operationId: patchMySettings
      tags: [Settings]
      description: Replaces the daily generation schedule fields supplied in the patch.
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: "#/components/schemas/UserSettingsPatch" }
      responses:
        "200":
          description: Updated user settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/me/feed-subscriptions/{subscriptionId}:
    patch:
      operationId: patchMyFeedSubscription
      tags: [Subscriptions]
      description: Enables or disables one subscription owned by the current session user.
      parameters:
        - $ref: "#/components/parameters/SubscriptionId"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200":
          description: Updated subscription.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedSubscription" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteMyFeedSubscription
      tags: [Subscriptions]
      description: Removes one subscription owned by the current session user.
      parameters:
        - $ref: "#/components/parameters/SubscriptionId"
      responses:
        "204": { description: Subscription removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/episode-jobs:
    get:
      operationId: listMyEpisodeJobs
      tags: [Episode jobs]
      description: Returns only jobs owned by the authenticated user.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/JobStatus" }
      responses:
        "200":
          description: Owner-scoped job page, ordered by createdAt then id descending.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EpisodeJobPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createEpisodeJob
      tags: [Episode jobs]
      description: >-
        Creates an asynchronous manual job from a snapshot of all enabled subscriptions.
        The scheduler invokes the same application command with trigger=scheduled internally.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateEpisodeJobRequest" }
      responses:
        "202":
          description: Job accepted. Replays with the same owner, key, route, and request hash return the same receipt.
          headers:
            Location: { $ref: "#/components/headers/Location" }
            Idempotency-Key: { $ref: "#/components/headers/IdempotencyKey" }
            Retry-After: { $ref: "#/components/headers/RetryAfter" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EpisodeJobReceipt" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/episode-jobs/{jobId}:
    get:
      operationId: getMyEpisodeJob
      tags: [Episode jobs]
      description: A foreign owner's identifier is indistinguishable from a missing identifier and returns 404.
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Owner-scoped episode job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EpisodeJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/episodes:
    get:
      operationId: listMyEpisodes
      tags: [Episodes]
      description: Returns only episodes owned by the authenticated user.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: publishedFrom
          in: query
          schema: { type: string, format: date-time }
        - name: publishedTo
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Owner-scoped episode page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EpisodePage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/episodes/{episodeId}:
    get:
      operationId: getMyEpisode
      tags: [Episodes]
      description: A foreign owner's identifier is indistinguishable from a missing identifier and returns 404.
      parameters:
        - $ref: "#/components/parameters/EpisodeId"
      responses:
        "200":
          description: Owner-scoped episode without a persistent signed audio URL.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Episode" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/episodes/{episodeId}/audio-access:
    post:
      operationId: createMyEpisodeAudioAccess
      tags: [Episodes]
      description: Issues a short-lived bearer-capability URL for one owned episode.
      parameters:
        - $ref: "#/components/parameters/EpisodeId"
      responses:
        "200":
          description: Short-lived audio access.
          headers:
            Cache-Control:
              description: Signed URLs must not be cached by shared or private caches.
              schema: { type: string, const: "private, no-store" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AudioAccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: __Host-better-auth.session_token
      description: >-
        Better Auth application session. The deployed cookie name and secure prefix are generated
        from Better Auth configuration; this name is documentary and must be synchronized in tests.
    GoogleOIDC:
      type: openIdConnect
      openIdConnectUrl: https://accounts.google.com/.well-known/openid-configuration
      description: Login upstream only. Google tokens are not accepted as /v1 bearer credentials.
  parameters:
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor bound to the endpoint's filters and stable sort.
      schema: { type: string, minLength: 1, maxLength: 2048 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Non-empty ASCII value scoped to owner, method, and canonical route; retained for at least 24 hours.
      schema: { type: string, minLength: 1, maxLength: 255, pattern: "^[\\x20-\\x7E]+$" }
    JobId:
      name: jobId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    EpisodeId:
      name: episodeId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    SubscriptionId:
      name: subscriptionId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
  headers:
    Location:
      description: Canonical URL of the created resource.
      required: true
      schema: { type: string, format: uri-reference }
    IdempotencyKey:
      description: Echo of the accepted Idempotency-Key.
      required: true
      schema: { type: string }
    RetryAfter:
      description: Suggested seconds before polling.
      schema: { type: integer, minimum: 1 }
  schemas:
    Id:
      type: string
      format: uuid
    JobStatus:
      type: string
      enum: [queued, running, succeeded, failed, canceled]
    CreateEpisodeJobRequest:
      type: object
      additionalProperties: false
      required: [trigger]
      properties:
        trigger:
          type: string
          const: manual
          description: Scheduled jobs are created by the trusted scheduler, not this public operation.
    GenerationSchedule:
      type: object
      additionalProperties: false
      required: [enabled, localTime, timeZone]
      properties:
        enabled: { type: boolean }
        localTime:
          type: string
          pattern: "^(?:[01]\\d|2[0-3]):[0-5]\\d$"
          example: "07:30"
        timeZone:
          type: string
          minLength: 1
          example: Asia/Tokyo
          description: IANA time zone identifier.
    UserSettings:
      type: object
      additionalProperties: false
      required: [generationSchedule]
      properties:
        generationSchedule: { $ref: "#/components/schemas/GenerationSchedule" }
    UserSettingsPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        generationSchedule:
          oneOf:
            - $ref: "#/components/schemas/GenerationSchedule"
            - type: "null"
          description: Null disables and resets the schedule to application defaults.
    PageInfo:
      type: object
      additionalProperties: false
      required: [hasMore]
      properties:
        nextCursor: { type: string }
        hasMore: { type: boolean }
    Feed:
      type: object
      additionalProperties: false
      required: [id, name, siteUrl, feedUrl]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { type: string }
        siteUrl: { type: string, format: uri }
        feedUrl: { type: string, format: uri }
    FeedSubscription:
      type: object
      additionalProperties: false
      required: [id, feedId, enabled, createdAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        feedId: { $ref: "#/components/schemas/Id" }
        enabled: { type: boolean }
        createdAt: { type: string, format: date-time }
    EpisodeJobReceipt:
      type: object
      additionalProperties: false
      required: [id, status, createdAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        status: { $ref: "#/components/schemas/JobStatus" }
        createdAt: { type: string, format: date-time }
    JobFailure:
      type: object
      additionalProperties: false
      required: [code, message, retryable]
      properties:
        code: { type: string }
        message: { type: string }
        retryable: { type: boolean }
    EpisodeJob:
      allOf:
        - $ref: "#/components/schemas/EpisodeJobReceipt"
        - type: object
          additionalProperties: false
          properties:
            startedAt: { type: string, format: date-time }
            finishedAt: { type: string, format: date-time }
            episodeId: { $ref: "#/components/schemas/Id" }
            failure: { $ref: "#/components/schemas/JobFailure" }
      description: succeeded has episodeId; failed has failure; terminal states never transition.
    EpisodeSource:
      type: object
      additionalProperties: false
      required: [url, title]
      properties:
        url: { type: string, format: uri }
        title: { type: string }
        publishedAt: { type: string, format: date-time }
    Episode:
      type: object
      additionalProperties: false
      required: [id, title, script, sources, createdAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        title: { type: string }
        script: { type: string }
        sources:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/EpisodeSource" }
        createdAt: { type: string, format: date-time }
    AudioAccess:
      type: object
      additionalProperties: false
      required: [url, expiresAt]
      properties:
        url: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        code: { type: string }
        traceId: { type: string }
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [pointer, code, message]
            properties:
              pointer: { type: string }
              code: { type: string }
              message: { type: string }
    FeedPage:
      $ref: "#/components/schemas/PagedFeeds"
    PagedFeeds:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Feed" } }
        page: { $ref: "#/components/schemas/PageInfo" }
    FeedSubscriptionPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/FeedSubscription" } }
        page: { $ref: "#/components/schemas/PageInfo" }
    EpisodeJobPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/EpisodeJob" } }
        page: { $ref: "#/components/schemas/PageInfo" }
    EpisodePage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Episode" } }
        page: { $ref: "#/components/schemas/PageInfo" }
  responses:
    BadRequest:
      description: Invalid request or cursor.
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    Unauthorized:
      description: Missing, expired, or revoked session.
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    Forbidden:
      description: Authenticated principal lacks permission.
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    NotFound:
      description: Resource is missing or owned by another principal.
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    Conflict:
      description: Resource conflicts with an existing record.
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    IdempotencyConflict:
      description: The key was already used with a different canonical request hash.
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    ServiceUnavailable:
      description: A required dependency is unavailable.
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
