<!doctype html>
<html lang="ja">
  <head><title>コードブロックの変換</title></head>
  <body>
    <article>
      <h1>コードブロックの変換</h1>
      <p>仮想テーブルの定義はこうなります。実際に動かして索引サイズを測ってください。</p>
      <pre><code class="language-sql">CREATE VIRTUAL TABLE feed_items_fts USING fts5(
  title, summary, body,
  tokenize = 'trigram'
);</code></pre>
      <p>ハイライタが入っているとトークンが span に分割されます。この形でも言語が拾えるかを確認したい。</p>
      <pre><code class="language-ts"><span class="tok-kw">const</span> <span class="tok-id">rows</span> = db.<span class="tok-fn">prepare</span>(sql).<span class="tok-fn">all</span>()</code></pre>
      <p>言語クラスの無いブロックもあります。</p>
      <pre><code>pnpm vitest run</code></pre>
    </article>
  </body>
</html>
