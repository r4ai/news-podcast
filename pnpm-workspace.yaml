packages:
  - "apps/*"
  - "packages/*"

overrides:
  "brace-expansion@>=3.0.0 <5.0.9": "5.0.9"
  "nanoid@<3.3.17": "3.3.17"
  "postcss@<=8.5.22": "8.5.23"

# Supply-chain policy: use only releases that have had time for community
# scrutiny, keep the existing lockfile trusted, and disallow non-registry
# transitive sources.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  # Cloudflare publishes this generated type package daily; retain the
  # explicitly pinned version required by this repository.
  - "@cloudflare/workers-types@5.20260809.1"
trustPolicy: no-downgrade
trustPolicyExclude:
  # Audited transitive releases required by Spectral/Storybook. Keep these
  # exceptions version-scoped so newer releases are verified normally.
  - "rollup@2.80.0"
  - "semver@6.3.1"
blockExoticSubdeps: true

# Dependency lifecycle scripts are denied unless listed here. Native build
# helpers are allowed; Scarf telemetry is explicitly denied.
strictDepBuilds: true
allowBuilds:
  "@scarf/scarf": false
  esbuild: true
  protobufjs: true
  workerd: true

# `pnpm add` writes exact versions; committed manifests and the lockfile remain
# the source of truth for upgrades.
saveExact: true
