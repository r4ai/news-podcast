name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 11.16.0

jobs:
  static:
    name: static
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint source and contracts
        run: pnpm lint

      - name: Typecheck workspace
        run: pnpm typecheck

      - name: Build workspace
        run: pnpm build

      - name: Check generated contracts
        run: pnpm contract:check

      - name: Check provider contracts
        run: pnpm provider-contract:check

      - name: Check generated markdown corpus
        run: pnpm markdown:corpus:check

      - name: Check SQLite state policy
        run: pnpm test:sqlite-state

      - name: Check load-test harness
        run: pnpm loadtest:test

      - name: Build Storybook
        run: pnpm storybook:build

      - name: Validate Compose files
        run: |
          docker compose config --quiet
          docker compose -f infra/e2e/compose.yaml config --quiet
          docker compose -f infra/observability/compose.yaml config --quiet
          docker compose -f compose.yaml -f compose.observability.yaml config --quiet

  unit:
    name: unit
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit and integration tests
        run: pnpm test

      - name: Check functional coverage
        run: pnpm test:coverage:functional

  web-e2e:
    name: web-e2e
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Run browser E2E
        run: pnpm test:e2e
        env:
          E2E_API_PORT: 3310
          E2E_WEB_PORT: 4374

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-e2e-results
          path: apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  visual:
    name: visual
    runs-on: ubuntu-24.04
    # スナップショットの比較はピクセル単位なので、フォントとラスタライザが
    # 違えば同じページでも別の絵になる。ローカルの`pnpm test:visual`も
    # scripts/run-visual.sh が同じイメージで実行し、環境差そのものを無くす。
    # apps/web の @playwright/test と同じversionを指すこと。
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      # Chromiumが共有メモリ不足で落ちるのを避ける公式推奨の設定。
      options: --ipc=host
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run visual regression tests
        run: pnpm test:visual

      - name: Upload visual diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-results
          path: apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  functional-e2e:
    name: functional-e2e
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run functional E2E
        run: pnpm test:e2e:functional

      - name: Upload functional stack diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: functional-e2e-results
          path: ${{ runner.temp }}/functional-e2e
          if-no-files-found: ignore
          retention-days: 7

  observability:
    name: observability
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare hermetic runtime environment
        run: pnpm setup:env

      - name: Validate observability configuration
        run: pnpm observability:validate

      - name: Run observed fake-provider stack smoke test
        run: |
          set -euo pipefail
          log_directory="$RUNNER_TEMP/observability"
          mkdir -p "$log_directory"
          cleanup() {
            status=$?
            if (( status != 0 )); then
              docker compose -f compose.yaml -f compose.observability.yaml logs --no-color >"$log_directory/application.log" 2>&1 || true
              docker compose -f infra/observability/compose.yaml logs --no-color >"$log_directory/observability.log" 2>&1 || true
            fi
            docker compose -f compose.yaml -f compose.observability.yaml down --remove-orphans || true
            docker compose -f infra/observability/compose.yaml down --remove-orphans || true
            exit "$status"
          }
          trap cleanup EXIT

          pnpm observability:infra:up
          PROVIDER_MODE=fake docker compose -f compose.yaml -f compose.observability.yaml up -d --build --wait

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4101/health/ready >/dev/null; then
              break
            fi
            if (( attempt == 30 )); then
              echo "Gateway did not become ready" >&2
              exit 1
            fi
            sleep 2
          done

          for attempt in $(seq 1 5); do
            curl --fail --silent http://127.0.0.1:4001/api/auth/state >/dev/null
            sleep 2
          done

          dev_auth_password="$(sed -n 's/^DEV_AUTH_PASSWORD=//p' .env)"
          if [[ -z "$dev_auth_password" ]]; then
            echo "Hermetic development auth password is missing" >&2
            exit 1
          fi
          cookie_jar="$RUNNER_TEMP/observability-dev-auth.cookies"
          curl --fail --silent --show-error \
            --cookie-jar "$cookie_jar" \
            --header "content-type: application/json" \
            --data "{\"password\":\"$dev_auth_password\"}" \
            http://127.0.0.1:4001/api/dev/login >/dev/null
          curl --fail --silent --show-error \
            --cookie "$cookie_jar" \
            http://127.0.0.1:4001/v1/me/feed-subscriptions >/dev/null

          pnpm observability:synthetic
          pnpm observability:smoke

      - name: Upload observability diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: observability-results
          path: ${{ runner.temp }}/observability
          if-no-files-found: ignore
          retention-days: 7
